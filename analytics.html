<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="/manifest.json">
  <title>Expenses Analysis Overview - Giftoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    #full-list::-webkit-scrollbar { width: 4px; }
    #full-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen w-full p-3 flex flex-col gap-3 max-w-2xl mx-auto">

  <!-- TOP BAR -->
  <header class="glass-card p-3 rounded-2xl flex justify-between items-center">
    <div class="flex items-center gap-2">
      <a href="/" class="w-8 h-8 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-slate-300">←</a>
      <h1 class="text-sm font-extrabold text-indigo-400">📊 Expense Analytics Overview</h1>
    </div>
    <button onclick="exportAnalyticsPDF()" class="bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 px-3 py-1.5 rounded-xl text-xs font-extrabold">
      Export Detailed PDF 📄
    </button>
  </header>

  <!-- OVERVIEW METRIC CARDS (Dynamically updates based on filter selection) -->
  <section class="grid grid-cols-3 gap-2">
    <div class="glass-card p-2.5 rounded-2xl text-center">
      <span class="text-[9px] font-bold text-emerald-400 uppercase block">Total Income</span>
      <h3 id="analytics-income" class="text-xs font-black text-emerald-400 mt-0.5">+₹0</h3>
    </div>
    <div class="glass-card p-2.5 rounded-2xl text-center">
      <span class="text-[9px] font-bold text-rose-400 uppercase block">Total Expense</span>
      <h3 id="analytics-expense" class="text-xs font-black text-rose-400 mt-0.5">-₹0</h3>
    </div>
    <div class="glass-card p-2.5 rounded-2xl text-center">
      <span class="text-[9px] font-bold text-sky-400 uppercase block">Net Balance</span>
      <h3 id="analytics-balance" class="text-xs font-black text-white mt-0.5">₹0</h3>
    </div>
  </section>

  <!-- SEARCH & FILTER OPTIONS (Positioned ABOVE Pie Chart, Default: 1 Month) -->
  <section class="glass-card p-3 rounded-2xl space-y-2">
    <input type="text" id="search-input" oninput="applyFilters()" placeholder="🔍 Search description or user..." class="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-xl p-2">

    <div class="grid grid-cols-3 gap-2">
      <div>
        <label class="text-[9px] font-extrabold text-slate-400 uppercase block mb-0.5">User</label>
        <select id="user-filter" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg p-1.5 font-bold">
          <option value="all">All Users</option>
        </select>
      </div>

      <div>
        <label class="text-[9px] font-extrabold text-slate-400 uppercase block mb-0.5">Type</label>
        <select id="type-filter" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg p-1.5 font-bold">
          <option value="all">All Types</option>
          <option value="expense">Expense 💸</option>
          <option value="income">Income 💰</option>
        </select>
      </div>

      <div>
        <label class="text-[9px] font-extrabold text-slate-400 uppercase block mb-0.5">Timeframe</label>
        <select id="time-filter" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg p-1.5 font-bold">
          <option value="1m" selected>Last 1 Mo</option>
          <option value="1w">Last 1 Wk</option>
          <option value="3m">Last 3 Mo</option>
          <option value="1y">Last 1 Yr</option>
          <option value="all">All Time</option>
        </select>
      </div>
    </div>
  </section>

  <!-- COMPACT CATEGORY PIE CHART SECTION -->
  <section class="glass-card p-3 rounded-2xl space-y-1.5">
    <h2 class="text-xs font-extrabold text-sky-400 uppercase tracking-wider">Category Spending Breakdown (%)</h2>
    <div class="w-full h-40 flex items-center justify-center relative">
      <canvas id="categoryChart"></canvas>
    </div>
  </section>

  <!-- DETAILED TRANSACTIONS LIST BELOW -->
  <section class="glass-card p-3 rounded-2xl flex-1 space-y-2">
    <div class="flex justify-between items-center px-1">
      <span id="record-count" class="text-xs font-bold text-slate-400">0 records found</span>
      <span id="filtered-total" class="text-xs font-black text-amber-400">Net Total: ₹0</span>
    </div>
    <ul id="full-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></ul>
  </section>

  <script>
    Chart.register(ChartDataLabels);

    let rawTransactions = [];
    let filteredTransactions = [];
    let categoryChartObj = null;

    async function initAnalytics() {
      const sessionRes = await fetch('/api/session');
      if (!sessionRes.ok) return window.location.href = '/login';
      const user = await sessionRes.json();
      if (user.role !== 'admin') return window.location.href = '/';

      const usersRes = await fetch('/api/admin/users');
      const users = await usersRes.json();
      const userSelect = document.getElementById('user-filter');
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.innerText = `@${u.username}`;
        userSelect.appendChild(opt);
      });

      const res = await fetch('/api/transactions?filter=all');
      rawTransactions = await res.json();

      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const type = document.getElementById('type-filter').value;
      const time = document.getElementById('time-filter').value;
      const userSelect = document.getElementById('user-filter').value;

      filteredTransactions = rawTransactions.filter(tx => {
        const matchesSearch = (tx.title || '').toLowerCase().includes(search) || (tx.category || '').toLowerCase().includes(search) || (tx.username || '').toLowerCase().includes(search);
        const matchesType = type === 'all' || tx.type === type;
        const matchesUser = userSelect === 'all' || tx.userId === userSelect;

        let matchesTime = true;
        if (time !== 'all') {
          const now = new Date();
          let cutoff = new Date();
          if (time === '1w') cutoff.setDate(now.getDate() - 7);
          else if (time === '1m') cutoff.setMonth(now.getMonth() - 1);
          else if (time === '3m') cutoff.setMonth(now.getMonth() - 3);
          else if (time === '1y') cutoff.setFullYear(now.getFullYear() - 1);
          matchesTime = new Date(tx.date) >= cutoff;
        }

        return matchesSearch && matchesType && matchesUser && matchesTime;
      });

      calculateMetrics();
      renderCategoryChart();
      renderList();
    }

    function calculateMetrics() {
      let inc = 0, exp = 0;
      filteredTransactions.forEach(t => {
        if (t.type === 'income') inc += Number(t.amount);
        else exp += Number(t.amount);
      });

      document.getElementById('analytics-income').innerText = `+₹${inc.toLocaleString('en-IN')}`;
      document.getElementById('analytics-expense').innerText = `-₹${exp.toLocaleString('en-IN')}`;
      document.getElementById('analytics-balance').innerText = `₹${(inc - exp).toLocaleString('en-IN')}`;
    }

    function renderCategoryChart() {
      const expenses = filteredTransactions.filter(t => t.type === 'expense');
      const categoryTotals = {};
      let totalExpenseSum = 0;

      expenses.forEach(t => {
        const cat = t.category.split(' ')[0];
        const amt = Number(t.amount);
        categoryTotals[cat] = (categoryTotals[cat] || 0) + amt;
        totalExpenseSum += amt;
      });

      const catLabels = Object.keys(categoryTotals).map(c => {
        const pct = totalExpenseSum > 0 ? Math.round((categoryTotals[c] / totalExpenseSum) * 100) : 0;
        return `${c} (${pct}%)`;
      });

      const catCtx = document.getElementById('categoryChart').getContext('2d');
      if (categoryChartObj) categoryChartObj.destroy();

      categoryChartObj = new Chart(catCtx, {
        type: 'pie',
        data: {
          labels: catLabels.length > 0 ? catLabels : ['No Expenses'],
          datasets: [{
            data: Object.values(categoryTotals).length > 0 ? Object.values(categoryTotals) : [1],
            backgroundColor: ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc', font: { size: 9, weight: 'bold' } } },
            datalabels: {
              color: '#ffffff',
              font: { weight: '800', size: 10 },
              formatter: (val) => totalExpenseSum > 0 ? `${Math.round((val / totalExpenseSum) * 100)}%` : ''
            }
          }
        }
      });
    }

    function renderList() {
      const list = document.getElementById('full-list');
      list.innerHTML = '';
      let netTotal = 0;

      if (filteredTransactions.length === 0) {
        list.innerHTML = `<li class="text-center py-5 text-xs text-slate-500 font-medium">No matching transactions found.</li>`;
      } else {
        filteredTransactions.forEach(tx => {
          const isIncome = tx.type === 'income';
          if (isIncome) netTotal += Number(tx.amount);
          else netTotal -= Number(tx.amount);

          const dateStr = new Date(tx.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-2.5 bg-slate-900/80 rounded-xl border ${isIncome ? 'border-emerald-500/30' : 'border-slate-800'}`;
          li.innerHTML = `
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-lg ${isIncome ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} flex items-center justify-center font-bold text-xs">
                ${isIncome ? '⇣' : '⇡'}
              </div>
              <div>
                <p class="text-xs font-bold text-slate-200 leading-tight">${tx.title}</p>
                <p class="text-[9px] font-semibold text-slate-400">
                  <span class="text-amber-400 font-bold">@${tx.username}</span> • ${tx.category} • ${dateStr}
                </p>
              </div>
            </div>
            <span class="text-xs font-extrabold ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
              ${isIncome ? '+' : '-'}₹${Number(tx.amount).toLocaleString('en-IN')}
            </span>
          `;
          list.appendChild(li);
        });
      }

      document.getElementById('record-count').innerText = `${filteredTransactions.length} records found`;
      document.getElementById('filtered-total').innerText = `Net Total: ₹${netTotal.toLocaleString('en-IN')}`;
    }

    function exportAnalyticsPDF() {
      if (filteredTransactions.length === 0) return alert('No transactions available to export.');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');

      let inc = 0, exp = 0;
      filteredTransactions.forEach(t => {
        if (t.type === 'income') inc += Number(t.amount);
        else exp += Number(t.amount);
      });
      const net = inc - exp;

      const cleanStr = (s) => String(s || '').replace(/[^\x00-\x7F]/g, "").trim();

      // BRANDING HEADER
      doc.setFillColor(11, 15, 23);
      doc.rect(0, 0, 210, 36, 'F');

      doc.setFillColor(66, 199, 187);
      doc.rect(14, 10, 4, 16, 'F');

      doc.setTextColor(66, 199, 187);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(20);
      doc.text("giftoo", 22, 18);

      doc.setTextColor(248, 250, 252);
      doc.setFontSize(11);
      doc.text("Financial Analytics Statement", 22, 24);

      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(148, 163, 184);
      doc.text(`Generated: ${new Date().toLocaleDateString('en-IN')}`, 155, 22);

      // HIGH-CONTRAST METRICS CARDS
      const cardY = 42;
      const cardWidth = 56;
      const cardHeight = 22;

      doc.setFillColor(30, 41, 59);
      doc.setDrawColor(16, 185, 129);
      doc.setLineWidth(0.4);
      doc.roundedRect(14, cardY, cardWidth, cardHeight, 3, 3, 'FD');

      doc.setFontSize(7.5);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(16, 185, 129);
      doc.text("TOTAL INCOME", 19, cardY + 7);
      doc.setFontSize(12);
      doc.setTextColor(248, 250, 252);
      doc.text(`+ Rs. ${inc.toLocaleString('en-IN')}`, 19, cardY + 16);

      doc.setFillColor(30, 41, 59);
      doc.setDrawColor(239, 68, 68);
      doc.roundedRect(77, cardY, cardWidth, cardHeight, 3, 3, 'FD');

      doc.setFontSize(7.5);
      doc.setTextColor(239, 68, 68);
      doc.text("TOTAL EXPENSES", 82, cardY + 7);
      doc.setFontSize(12);
      doc.setTextColor(248, 250, 252);
      doc.text(`- Rs. ${exp.toLocaleString('en-IN')}`, 82, cardY + 16);

      doc.setFillColor(30, 41, 59);
      doc.setDrawColor(56, 189, 248);
      doc.roundedRect(140, cardY, cardWidth, cardHeight, 3, 3, 'FD');

      doc.setFontSize(7.5);
      doc.setTextColor(56, 189, 248);
      doc.text("NET BALANCE", 145, cardY + 7);
      doc.setFontSize(12);
      doc.setTextColor(248, 250, 252);
      doc.text(`Rs. ${net.toLocaleString('en-IN')}`, 145, cardY + 16);

      // TABLE LEDGER
      const tableRows = filteredTransactions.map((tx, i) => [
        i + 1,
        cleanStr(tx.username),
        new Date(tx.date).toLocaleDateString('en-IN'),
        cleanStr(tx.title),
        cleanStr(tx.category),
        tx.type.toUpperCase(),
        `Rs. ${Number(tx.amount).toLocaleString('en-IN')}`
      ]);

      doc.autoTable({
        startY: 70,
        head: [['#', 'User', 'Date', 'Description', 'Category', 'Type', 'Amount']],
        body: tableRows,
        theme: 'striped',
        headStyles: {
          fillColor: [15, 23, 42],
          textColor: [56, 189, 248],
          fontStyle: 'bold',
          fontSize: 9,
          cellPadding: 4
        },
        bodyStyles: {
          fontSize: 8.5,
          textColor: [30, 41, 59],
          cellPadding: 3.5
        },
        alternateRowStyles: {
          fillColor: [248, 250, 252]
        },
        columnStyles: {
          0: { cellWidth: 10, halign: 'center' },
          1: { cellWidth: 25, fontStyle: 'bold' },
          2: { cellWidth: 25 },
          3: { cellWidth: 45 },
          4: { cellWidth: 35 },
          5: { cellWidth: 22, fontStyle: 'bold' },
          6: { cellWidth: 28, halign: 'right', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
          if (data.section === 'body' && data.column.index === 5) {
            if (data.cell.raw === 'EXPENSE') {
              data.cell.styles.textColor = [225, 29, 72];
            } else if (data.cell.raw === 'INCOME') {
              data.cell.styles.textColor = [16, 185, 129];
            }
          }
        }
      });

      doc.save(`Giftoo_Detailed_Analytics.pdf`);
    }

    initAnalytics();
  </script>
</body>
</html>
