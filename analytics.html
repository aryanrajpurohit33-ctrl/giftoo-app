<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="/manifest.json">
  <title>Expenses Analysis Overview - Giftoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen w-full p-3 flex flex-col gap-4 max-w-2xl mx-auto">

  <!-- TOP BAR -->
  <header class="glass-card p-3 rounded-2xl flex justify-between items-center">
    <div class="flex items-center gap-2">
      <a href="/" class="w-8 h-8 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-slate-300">←</a>
      <h1 class="text-sm font-extrabold text-indigo-400">📊 Expense Analytics Overview</h1>
    </div>
    <button onclick="exportAnalyticsPDF()" class="bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 px-3 py-1.5 rounded-xl text-xs font-extrabold">
      Export Detailed PDF 📄
    </button>
  </header>

  <!-- CATEGORY PIE CHART -->
  <section class="glass-card p-4 rounded-2xl space-y-2">
    <h2 class="text-xs font-extrabold text-sky-400 uppercase tracking-wider">Category Spending Breakdown (%)</h2>
    <div class="w-full h-52 flex items-center justify-center">
      <canvas id="categoryChart"></canvas>
    </div>
  </section>

  <!-- USER SPENDING PIE CHART -->
  <section class="glass-card p-4 rounded-2xl space-y-2">
    <h2 class="text-xs font-extrabold text-amber-400 uppercase tracking-wider">User Expense Distribution (%)</h2>
    <div class="w-full h-52 flex items-center justify-center">
      <canvas id="userChart"></canvas>
    </div>
  </section>

  <script>
    Chart.register(ChartDataLabels);

    let allTransactions = [];
    let categoryChartObj = null;
    let userChartObj = null;

    async function initAnalytics() {
      const sessionRes = await fetch('/api/session');
      if (!sessionRes.ok) return window.location.href = '/login';
      const user = await sessionRes.json();
      if (user.role !== 'admin') return window.location.href = '/';

      const res = await fetch('/api/transactions?filter=all');
      allTransactions = await res.json();

      renderCharts();
    }

    function renderCharts() {
      const expenses = allTransactions.filter(t => t.type === 'expense');

      // 1. CATEGORY BREAKDOWN
      const categoryTotals = {};
      let totalExpenseSum = 0;
      expenses.forEach(t => {
        const cat = t.category.split(' ')[0];
        const amt = Number(t.amount);
        categoryTotals[cat] = (categoryTotals[cat] || 0) + amt;
        totalExpenseSum += amt;
      });

      const catLabels = Object.keys(categoryTotals).map(c => {
        const pct = totalExpenseSum > 0 ? Math.round((categoryTotals[c] / totalExpenseSum) * 100) : 0;
        return `${c} (${pct}%)`;
      });

      const catCtx = document.getElementById('categoryChart').getContext('2d');
      if (categoryChartObj) categoryChartObj.destroy();
      categoryChartObj = new Chart(catCtx, {
        type: 'pie',
        data: {
          labels: catLabels.length > 0 ? catLabels : ['No Expenses'],
          datasets: [{
            data: Object.values(categoryTotals).length > 0 ? Object.values(categoryTotals) : [1],
            backgroundColor: ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc', font: { size: 10, weight: 'bold' } } },
            datalabels: {
              color: '#ffffff',
              font: { weight: '800', size: 11 },
              formatter: (val) => totalExpenseSum > 0 ? `${Math.round((val / totalExpenseSum) * 100)}%` : ''
            }
          }
        }
      });

      // 2. USER BREAKDOWN
      const userTotals = {};
      expenses.forEach(t => {
        const u = `@${t.username}`;
        const amt = Number(t.amount);
        userTotals[u] = (userTotals[u] || 0) + amt;
      });

      const userLabels = Object.keys(userTotals).map(u => {
        const pct = totalExpenseSum > 0 ? Math.round((userTotals[u] / totalExpenseSum) * 100) : 0;
        return `${u} (${pct}%)`;
      });

      const userCtx = document.getElementById('userChart').getContext('2d');
      if (userChartObj) userChartObj.destroy();
      userChartObj = new Chart(userCtx, {
        type: 'pie',
        data: {
          labels: userLabels.length > 0 ? userLabels : ['No Data'],
          datasets: [{
            data: Object.values(userTotals).length > 0 ? Object.values(userTotals) : [1],
            backgroundColor: ['#38bdf8', '#a855f7', '#f43f5e', '#eab308', '#22c55e']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc', font: { size: 10, weight: 'bold' } } },
            datalabels: {
              color: '#ffffff',
              font: { weight: '800', size: 11 },
              formatter: (val) => totalExpenseSum > 0 ? `${Math.round((val / totalExpenseSum) * 100)}%` : ''
            }
          }
        }
      });
    }

    function exportAnalyticsPDF() {
      if (allTransactions.length === 0) return alert('No transaction data found.');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const cleanStr = (s) => String(s || '').replace(/[^\x00-\x7F]/g, "").trim();

      doc.setFontSize(16);
      doc.text("Giftoo - Expense Analytics Overview Report", 14, 18);
      doc.setFontSize(10);
      doc.text(`Generated on: ${new Date().toLocaleDateString('en-IN')}`, 14, 25);

      const tableRows = allTransactions.map((tx, i) => [
        i + 1, cleanStr(tx.username), new Date(tx.date).toLocaleDateString('en-IN'), cleanStr(tx.title), cleanStr(tx.category), tx.type.toUpperCase(), `Rs.${tx.amount}`
      ]);

      doc.autoTable({
        startY: 32,
        head: [['#', 'User', 'Date', 'Description', 'Category', 'Type', 'Amount']],
        body: tableRows,
        styles: { fontSize: 8 }
      });

      doc.save(`Giftoo_Analytics_Overview.pdf`);
    }

    initAnalytics();
  </script>
</body>
</html>
