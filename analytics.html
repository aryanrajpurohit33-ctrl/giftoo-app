<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="/manifest.json">
  <title>Expenses Analysis Overview - Giftoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen w-full p-3 flex flex-col gap-4 max-w-2xl mx-auto">

  <!-- TOP BAR -->
  <header class="glass-card p-3 rounded-2xl flex justify-between items-center">
    <div class="flex items-center gap-2">
      <a href="/" class="w-8 h-8 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-slate-300">←</a>
      <h1 class="text-sm font-extrabold text-indigo-400">📊 Expense Analytics Overview</h1>
    </div>
    <button onclick="exportAnalyticsPDF()" class="bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 px-3 py-1.5 rounded-xl text-xs font-extrabold">
      Export Detailed PDF 📄
    </button>
  </header>

  <!-- OVERVIEW METRIC CARDS -->
  <section class="grid grid-cols-3 gap-2">
    <div class="glass-card p-3 rounded-2xl text-center">
      <span class="text-[9px] font-bold text-emerald-400 uppercase block">Total Income</span>
      <h3 id="analytics-income" class="text-sm font-black text-emerald-400 mt-1">+₹0</h3>
    </div>
    <div class="glass-card p-3 rounded-2xl text-center">
      <span class="text-[9px] font-bold text-rose-400 uppercase block">Total Expense</span>
      <h3 id="analytics-expense" class="text-sm font-black text-rose-400 mt-1">-₹0</h3>
    </div>
    <div class="glass-card p-3 rounded-2xl text-center">
      <span class="text-[9px] font-bold text-sky-400 uppercase block">Net Balance</span>
      <h3 id="analytics-balance" class="text-sm font-black text-white mt-1">₹0</h3>
    </div>
  </section>

  <!-- CATEGORY SPENDING BREAKDOWN PIE CHART -->
  <section class="glass-card p-4 rounded-2xl space-y-3">
    <h2 class="text-xs font-extrabold text-sky-400 uppercase tracking-wider">Category Spending Breakdown (%)</h2>
    <div class="w-full h-64 flex items-center justify-center relative">
      <canvas id="categoryChart"></canvas>
    </div>
  </section>

  <script>
    Chart.register(ChartDataLabels);

    let allTransactions = [];
    let categoryChartObj = null;

    async function initAnalytics() {
      const sessionRes = await fetch('/api/session');
      if (!sessionRes.ok) return window.location.href = '/login';
      const user = await sessionRes.json();
      if (user.role !== 'admin') return window.location.href = '/';

      const res = await fetch('/api/transactions?filter=all');
      allTransactions = await res.json();

      calculateMetrics();
      renderCategoryChart();
    }

    function calculateMetrics() {
      let inc = 0, exp = 0;
      allTransactions.forEach(t => {
        if (t.type === 'income') inc += Number(t.amount);
        else exp += Number(t.amount);
      });

      document.getElementById('analytics-income').innerText = `+₹${inc.toLocaleString('en-IN')}`;
      document.getElementById('analytics-expense').innerText = `-₹${exp.toLocaleString('en-IN')}`;
      document.getElementById('analytics-balance').innerText = `₹${(inc - exp).toLocaleString('en-IN')}`;
    }

    function renderCategoryChart() {
      const expenses = allTransactions.filter(t => t.type === 'expense');
      const categoryTotals = {};
      let totalExpenseSum = 0;

      expenses.forEach(t => {
        const cat = t.category.split(' ')[0];
        const amt = Number(t.amount);
        categoryTotals[cat] = (categoryTotals[cat] || 0) + amt;
        totalExpenseSum += amt;
      });

      const catLabels = Object.keys(categoryTotals).map(c => {
        const pct = totalExpenseSum > 0 ? Math.round((categoryTotals[c] / totalExpenseSum) * 100) : 0;
        return `${c} (${pct}%)`;
      });

      const catCtx = document.getElementById('categoryChart').getContext('2d');
      if (categoryChartObj) categoryChartObj.destroy();

      categoryChartObj = new Chart(catCtx, {
        type: 'pie',
        data: {
          labels: catLabels.length > 0 ? catLabels : ['No Expenses'],
          datasets: [{
            data: Object.values(categoryTotals).length > 0 ? Object.values(categoryTotals) : [1],
            backgroundColor: ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc', font: { size: 11, weight: 'bold' } } },
            datalabels: {
              color: '#ffffff',
              font: { weight: '800', size: 12 },
              formatter: (val) => totalExpenseSum > 0 ? `${Math.round((val / totalExpenseSum) * 100)}%` : ''
            }
          }
        }
      });
    }

    function exportAnalyticsPDF() {
      if (allTransactions.length === 0) return alert('No transactions available for export.');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      let inc = 0, exp = 0;
      allTransactions.forEach(t => {
        if (t.type === 'income') inc += Number(t.amount);
        else exp += Number(t.amount);
      });
      const net = inc - exp;

      const cleanStr = (s) => String(s || '').replace(/[^\x00-\x7F]/g, "").trim();

      // HEADER BRANDING
      doc.setFillColor(15, 23, 42); // #0f172a dark navy
      doc.rect(0, 0, 210, 40, 'F');

      doc.setTextColor(66, 199, 187); // #42C7BB giftoo blue
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(22);
      doc.text("giftoo", 14, 22);

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(14);
      doc.text("Financial Analytics Statement", 14, 32);

      doc.setFontSize(9);
      doc.setTextColor(148, 163, 184);
      doc.text(`Generated: ${new Date().toLocaleDateString('en-IN')}`, 145, 32);

      // FINANCIAL SUMMARY CARDS
      doc.setDrawColor(51, 65, 85);
      doc.setFillColor(30, 41, 59);

      // Income Card
      doc.roundedRect(14, 48, 58, 20, 3, 3, 'FD');
      doc.setFontSize(8);
      doc.setTextColor(16, 185, 129);
      doc.text("TOTAL INCOME", 18, 55);
      doc.setFontSize(11);
      doc.text(`+ Rs. ${inc.toLocaleString('en-IN')}`, 18, 63);

      // Expense Card
      doc.roundedRect(76, 48, 58, 20, 3, 3, 'FD');
      doc.setFontSize(8);
      doc.setTextColor(239, 68, 68);
      doc.text("TOTAL EXPENSES", 80, 55);
      doc.setFontSize(11);
      doc.text(`- Rs. ${exp.toLocaleString('en-IN')}`, 80, 63);

      // Net Balance Card
      doc.roundedRect(138, 48, 58, 20, 3, 3, 'FD');
      doc.setFontSize(8);
      doc.setTextColor(56, 189, 248);
      doc.text("NET BALANCE", 142, 55);
      doc.setFontSize(11);
      doc.setTextColor(255, 255, 255);
      doc.text(`Rs. ${net.toLocaleString('en-IN')}`, 142, 63);

      // ITEMIZED TABLE
      const tableRows = allTransactions.map((tx, i) => [
        i + 1,
        cleanStr(tx.username),
        new Date(tx.date).toLocaleDateString('en-IN'),
        cleanStr(tx.title),
        cleanStr(tx.category),
        tx.type.toUpperCase(),
        `Rs. ${Number(tx.amount).toLocaleString('en-IN')}`
      ]);

      doc.autoTable({
        startY: 76,
        head: [['#', 'User', 'Date', 'Description', 'Category', 'Type', 'Amount']],
        body: tableRows,
        theme: 'grid',
        headStyles: { fillColor: [15, 23, 42], textColor: [56, 189, 248], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [248, 250, 252] },
        styles: { fontSize: 8.5, cellPadding: 3 }
      });

      doc.save(`Giftoo_Detailed_Analytics.pdf`);
    }

    initAnalytics();
  </script>
</body>
</html>
