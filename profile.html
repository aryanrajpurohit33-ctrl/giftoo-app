<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User Profile - Giftoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    #tx-list::-webkit-scrollbar { width: 6px; }
    #tx-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6 max-w-xl mx-auto space-y-5">

  <!-- HEADER -->
  <header class="glass-card p-4 rounded-3xl flex justify-between items-center animate__animated animate__fadeInDown">
    <div class="flex items-center gap-2">
      <a href="/" class="p-2 bg-slate-800 rounded-xl text-xs font-bold hover:bg-slate-700 transition">← Dashboard</a>
      <h1 id="profile-title" class="text-base font-extrabold text-sky-400">User Profile</h1>
    </div>
    <span id="live-time" class="text-sm font-extrabold text-indigo-400">--:--</span>
  </header>

  <!-- OVERVIEW CARDS -->
  <section class="grid grid-cols-3 gap-3 animate__animated animate__fadeInUp">
    <div class="glass-card p-4 rounded-2xl flex flex-col justify-between">
      <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Balance</span>
      <h2 id="total-balance" class="text-lg font-black text-white mt-2">₹0</h2>
    </div>
    <div class="glass-card p-4 rounded-2xl flex flex-col justify-between border-emerald-500/20">
      <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Income</span>
      <h2 id="total-income" class="text-lg font-black text-emerald-400 mt-2">+₹0</h2>
    </div>
    <div class="glass-card p-4 rounded-2xl flex flex-col justify-between border-rose-500/20">
      <span class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">Expenses</span>
      <h2 id="total-expense" class="text-lg font-black text-rose-400 mt-2">-₹0</h2>
    </div>
  </section>

  <!-- FILTER & CHART SECTION -->
  <section class="glass-card p-5 rounded-3xl space-y-4 animate__animated animate__fadeInUp">
    <div class="flex justify-between items-center">
      <span class="text-xs font-bold text-sky-400 uppercase tracking-wider block">📊 Expense Analysis</span>
      
      <!-- DATE FILTER DROPDOWN -->
      <select id="date-filter" onchange="fetchUserTransactions()" class="bg-slate-900/90 border border-slate-700 text-xs text-white rounded-xl px-3 py-1.5 font-bold focus:outline-none focus:border-sky-500">
        <option value="all">All Time</option>
        <option value="1w">Last 1 Week</option>
        <option value="1m">Last 1 Month</option>
        <option value="3m">Last 3 Months</option>
        <option value="1y">Last 1 Year</option>
      </select>
    </div>

    <div class="w-full h-44 flex items-center justify-center">
      <canvas id="expenseChart"></canvas>
    </div>
  </section>

  <!-- USER TRANSACTIONS LIST -->
  <section class="glass-card p-6 rounded-3xl space-y-4 animate__animated animate__fadeInUp">
    <div class="flex justify-between items-center">
      <h2 class="text-base font-extrabold text-slate-100 flex items-center gap-2">
        <span>📜</span> Activity History
      </h2>
      <button onclick="exportPDF()" class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3.5 py-1.5 rounded-xl font-bold hover:bg-emerald-500/20 transition">
        Export PDF 📄
      </button>
    </div>

    <ul id="tx-list" class="space-y-2.5 max-h-72 overflow-y-auto pr-1"></ul>
  </section>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');
    let transactionsData = [];
    let myChart = null;
    let targetUsername = 'User';

    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').innerText = now.toLocaleTimeString('en-IN', {
        timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function initProfile() {
      if (!targetUserId) return window.location.href = '/';

      try {
        const res = await fetch(`/api/users/${targetUserId}`);
        if (!res.ok) return window.location.href = '/';
        const user = await res.json();
        targetUsername = user.username;
        document.getElementById('profile-title').innerText = `@${targetUsername}'s Profile`;
        fetchUserTransactions();
      } catch (err) {
        window.location.href = '/';
      }
    }

    async function fetchUserTransactions() {
      const filter = document.getElementById('date-filter').value;
      const res = await fetch(`/api/transactions?userId=${targetUserId}&filter=${filter}`);
      transactionsData = await res.json();
      renderUI();
      renderPieChart();
    }

    function renderUI() {
      const list = document.getElementById('tx-list');
      list.innerHTML = '';
      let incomeSum = 0, expenseSum = 0;

      if (transactionsData.length === 0) {
        list.innerHTML = `<li class="text-center py-6 text-xs text-slate-500 font-medium">No transactions found for this timeframe.</li>`;
      }

      transactionsData.forEach((tx) => {
        if (tx.type === 'income') incomeSum += Number(tx.amount);
        else expenseSum += Number(tx.amount);

        const isIncome = tx.type === 'income';
        const dateStr = new Date(tx.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-3.5 bg-slate-900/80 rounded-2xl border ${isIncome ? 'border-emerald-500/30' : 'border-slate-800'} transition`;

        li.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl ${isIncome ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} flex items-center justify-center font-bold text-sm">
              ${isIncome ? '⇣' : '⇡'}
            </div>
            <div>
              <p class="text-sm font-bold text-slate-200 leading-tight">${escapeHtml(tx.title)}</p>
              <p class="text-[10px] font-semibold text-slate-400">${tx.category} • ${dateStr}</p>
            </div>
          </div>
          <span class="text-sm font-extrabold ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
            ${isIncome ? '+' : '-'}₹${Number(tx.amount).toLocaleString('en-IN')}
          </span>
        `;
        list.appendChild(li);
      });

      const balance = incomeSum - expenseSum;
      document.getElementById('total-balance').innerText = `₹${balance.toLocaleString('en-IN')}`;
      document.getElementById('total-income').innerText = `+₹${incomeSum.toLocaleString('en-IN')}`;
      document.getElementById('total-expense').innerText = `-₹${expenseSum.toLocaleString('en-IN')}`;
    }

    function renderPieChart() {
      const categories = {};
      transactionsData.filter(t => t.type === 'expense').forEach(t => {
        const catName = t.category.split(' ')[0];
        categories[catName] = (categories[catName] || 0) + Number(t.amount);
      });

      const labels = Object.keys(categories);
      const data = Object.values(categories);

      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels.length > 0 ? labels : ['No Data'],
          datasets: [{
            data: data.length > 0 ? data : [1],
            backgroundColor: data.length > 0 ? ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'] : ['#334155']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc', font: { size: 10 } } }
          }
        }
      });
    }

    function exportPDF() {
      if (transactionsData.length === 0) return alert('No transactions available to export.');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.setTextColor(30, 41, 59);
      doc.text(`Giftoo - Statement for @${targetUsername}`, 14, 20);

      const tableRows = transactionsData.map((tx, idx) => [
        idx + 1,
        new Date(tx.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),
        tx.title,
        tx.category.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, ''),
        tx.type.toUpperCase(),
        `${tx.type === 'income' ? '+' : '-'} Rs.${Number(tx.amount).toLocaleString('en-IN')}`
      ]);

      doc.autoTable({
        startY: 30,
        head: [['#', 'Date', 'Description', 'Category', 'Type', 'Amount']],
        body: tableRows,
        theme: 'striped',
        headStyles: { fillColor: [66, 199, 187] },
        styles: { fontSize: 8 }
      });

      doc.save(`Giftoo_${targetUsername}_Report.pdf`);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    initProfile();
  </script>
</body>
</html>
