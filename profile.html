<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="/manifest.json">
  <title>User Profile - Giftoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen w-full p-3 flex flex-col gap-3 max-w-2xl mx-auto overflow-y-auto">

  <!-- TOP BAR -->
  <header class="glass-card p-3 rounded-2xl flex justify-between items-center">
    <div class="flex items-center gap-2">
      <a href="/admin" class="w-8 h-8 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-slate-300">←</a>
      <h1 id="profile-title" class="text-xs font-extrabold text-amber-400">👤 User Profile</h1>
    </div>
    <button onclick="exportUserProfilePDF()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl text-xs font-extrabold">
      Export PDF 📄
    </button>
  </header>

  <!-- USER ACCOUNT & CREDENTIALS CARD -->
  <section class="glass-card p-4 rounded-2xl space-y-3">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div>
        <h2 id="user-display-name" class="text-sm font-black text-white">@username</h2>
        <p id="user-role-badge" class="text-[10px] font-bold text-sky-400 uppercase mt-0.5">Role: user</p>
      </div>
      <div class="bg-slate-900 border border-slate-700/80 px-3 py-1.5 rounded-xl flex items-center gap-2">
        <span class="text-[10px] text-slate-400 font-bold uppercase">Password:</span>
        <span id="user-password-text" class="text-xs font-black tracking-widest text-amber-400">••••••••</span>
        <button onclick="togglePasswordVisibility()" class="text-xs p-1">👁️</button>
      </div>
    </div>

    <!-- METRIC CARDS -->
    <div class="grid grid-cols-3 gap-2 text-center pt-1">
      <div>
        <span class="text-[9px] font-bold text-slate-400 uppercase block">Total Income</span>
        <h3 id="user-income" class="text-xs font-extrabold text-emerald-400 mt-0.5">+₹0</h3>
      </div>
      <div>
        <span class="text-[9px] font-bold text-slate-400 uppercase block">Total Expense</span>
        <h3 id="user-expense" class="text-xs font-extrabold text-rose-400 mt-0.5">-₹0</h3>
      </div>
      <div>
        <span class="text-[9px] font-bold text-slate-400 uppercase block">Net Balance</span>
        <h3 id="user-balance" class="text-xs font-extrabold text-white mt-0.5">₹0</h3>
      </div>
    </div>
  </section>

  <!-- USER TRANSACTIONS LIST -->
  <section class="glass-card p-4 rounded-2xl space-y-2">
    <h2 class="text-xs font-extrabold text-slate-300 uppercase tracking-wider">Itemized Activity History</h2>
    <ul id="user-tx-list" class="space-y-2"></ul>
  </section>

  <script>
    let targetUser = null;
    let userTransactions = [];
    let showPassword = false;

    function togglePasswordVisibility() {
      showPassword = !showPassword;
      const pwdText = document.getElementById('user-password-text');
      if (showPassword) {
        pwdText.innerText = targetUser.password || 'N/A';
      } else {
        pwdText.innerText = '••••••••';
      }
    }

    async function initProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('id');
      if (!userId) return window.location.href = '/admin';

      const sessionRes = await fetch('/api/session');
      if (!sessionRes.ok) return window.location.href = '/login';
      const currentUser = await sessionRes.json();
      if (currentUser.role !== 'admin') return window.location.href = '/';

      const userRes = await fetch(`/api/users/${userId}`);
      targetUser = await userRes.json();

      document.getElementById('profile-title').innerText = `👤 @${targetUser.username}'s Profile`;
      document.getElementById('user-display-name').innerText = `@${targetUser.username}`;
      document.getElementById('user-role-badge').innerText = `Role: ${targetUser.role}`;

      const txRes = await fetch(`/api/transactions?userId=${userId}&filter=all`);
      userTransactions = await txRes.json();

      renderUserUI();
    }

    function renderUserUI() {
      const list = document.getElementById('user-tx-list');
      list.innerHTML = '';

      let inc = 0, exp = 0;

      if (userTransactions.length === 0) {
        list.innerHTML = `<li class="text-center py-6 text-xs text-slate-500 font-medium">No activity logged for this user.</li>`;
      } else {
        userTransactions.forEach(tx => {
          const isIncome = tx.type === 'income';
          if (isIncome) inc += Number(tx.amount);
          else exp += Number(tx.amount);

          const dateStr = new Date(tx.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-3 bg-slate-900/80 rounded-xl border ${isIncome ? 'border-emerald-500/30' : 'border-slate-800'}`;
          li.innerHTML = `
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg ${isIncome ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} flex items-center justify-center font-bold text-xs">
                ${isIncome ? '⇣' : '⇡'}
              </div>
              <div>
                <p class="text-xs font-bold text-slate-200 leading-tight">${tx.title}</p>
                <p class="text-[9px] font-semibold text-slate-400">${tx.category} • ${dateStr}</p>
              </div>
            </div>
            <span class="text-xs font-extrabold ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
              ${isIncome ? '+' : '-'}₹${Number(tx.amount).toLocaleString('en-IN')}
            </span>
          `;
          list.appendChild(li);
        });
      }

      document.getElementById('user-income').innerText = `+₹${inc.toLocaleString('en-IN')}`;
      document.getElementById('user-expense').innerText = `-₹${exp.toLocaleString('en-IN')}`;
      document.getElementById('user-balance').innerText = `₹${(inc - exp).toLocaleString('en-IN')}`;
    }

    function exportUserProfilePDF() {
      if (userTransactions.length === 0) return alert('No transaction records available for this user.');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const cleanStr = (s) => String(s || '').replace(/[^\x00-\x7F]/g, "").trim();

      doc.setFontSize(16);
      doc.text(`Giftoo - Statement: @${cleanStr(targetUser.username)}`, 14, 18);
      doc.setFontSize(10);
      doc.text(`Generated on: ${new Date().toLocaleDateString('en-IN')}`, 14, 25);

      const tableRows = userTransactions.map((tx, idx) => [
        idx + 1, new Date(tx.date).toLocaleDateString('en-IN'), cleanStr(tx.title), cleanStr(tx.category), tx.type.toUpperCase(), `Rs.${tx.amount}`
      ]);

      doc.autoTable({
        startY: 32,
        head: [['#', 'Date', 'Description', 'Category', 'Type', 'Amount']],
        body: tableRows,
        styles: { fontSize: 8 }
      });

      doc.save(`Giftoo_Statement_${cleanStr(targetUser.username)}.pdf`);
    }

    initProfile();
  </script>
</body>
</html>
