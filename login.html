<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="/manifest.json">
  <title>Login - Money</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100vh;
      height: -webkit-fill-available;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      touch-action: none;
      background-color: #0b0f17;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .money-glow {
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 overflow-hidden fixed inset-0">

  <div class="glass-card p-7 rounded-3xl w-full max-w-sm space-y-6 shadow-2xl">
    <!-- STYLED "MONEY" BRANDING LOGO HEADER -->
    <div class="flex justify-center pt-1">
      <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-700/80 px-5 py-3 rounded-2xl shadow-xl">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-cyan-400 text-slate-950 flex items-center justify-center font-black shadow-lg shadow-emerald-500/20">
          <svg class="w-6 h-6 text-slate-950" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 14.93V18h-2v-1.07A4.002 4.002 0 018 13h2a2 2 0 002 2c1.1 0 2-.9 2-2s-.9-2-2-2a4 4 0 01-4-4c0-1.86 1.28-3.41 3-3.86V6h2v1.07A4.002 4.002 0 0116 11h-2a2 2 0 00-2-2c-1.1 0-2 .9-2 2s.9 2 2 2a4 4 0 014 4c0 1.86-1.28 3.41-3 3.86z"/>
          </svg>
        </div>
        <span class="font-black text-3xl tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent money-glow">
          Money
        </span>
      </div>
    </div>

    <!-- ERROR ALERT -->
    <div id="error-alert" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold p-3 rounded-xl text-center"></div>

    <!-- LOGIN FORM -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">Username</label>
        <input type="text" id="username" required placeholder="Enter username" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-emerald-400 transition">
      </div>

      <div>
        <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">Password</label>
        <input type="password" id="password" required placeholder="Enter password" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-emerald-400 transition">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-emerald-400 to-cyan-400 hover:from-emerald-300 hover:to-cyan-300 text-slate-950 font-black rounded-xl text-xs py-3.5 mt-2 shadow-lg shadow-emerald-500/10 transition duration-200">
        Sign In 🔑
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('error-alert');
      const submitBtn = document.getElementById('submit-btn');
      
      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.replace('/');
        } else {
          alertBox.innerText = data.message || 'Invalid credentials';
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerText = 'Sign In 🔑';
        }
      } catch (err) {
        alertBox.innerText = 'Network error. Please try again.';
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In 🔑';
      }
    }
  </script>
</body>
</html>
