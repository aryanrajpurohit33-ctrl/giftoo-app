<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Giftoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 max-w-md mx-auto">

  <div class="glass-card p-8 rounded-3xl w-full space-y-6 animate__animated animate__fadeInDown">
    
    <!-- BRAND LOGO -->
    <div class="flex justify-center">
      <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-700/50">
        <svg class="h-10 w-auto" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="20" width="60" height="55" rx="6" fill="#65C9C0"/>
          <rect x="2" y="15" width="66" height="12" rx="3" fill="#65C9C0"/>
          <path d="M25 15C20 5 30 5 35 15Z" fill="#F472B6"/>
          <path d="M45 15C50 5 40 5 35 15Z" fill="#F472B6"/>
          <circle cx="25" cy="40" r="4" fill="#000"/>
          <circle cx="45" cy="40" r="4" fill="#000"/>
          <path d="M30 48Q35 53 40 48Z" fill="#F472B6" stroke="#000" stroke-width="1.5"/>
          <path d="M12 52Q20 45 22 52" stroke="#65C9C0" stroke-width="4" stroke-linecap="round"/>
          <path d="M58 52Q50 45 48 52" stroke="#65C9C0" stroke-width="4" stroke-linecap="round"/>
          <text x="78" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" fill="#42C7BB">giftoo</text>
          <path d="M218 20L224 14" stroke="#42C7BB" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M226 26L234 24" stroke="#42C7BB" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M224 33L231 36" stroke="#42C7BB" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="text-center space-y-1">
      <h1 class="text-xl font-black text-white">Welcome Back</h1>
      <p class="text-xs text-slate-400 font-semibold">Sign in with authorized credentials</p>
    </div>

    <div id="error-msg" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl text-center font-bold"></div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Username</label>
        <input type="text" id="login-username" inputmode="text" placeholder="Enter username" required autocomplete="username" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500 transition">
      </div>

      <div>
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Password</label>
        <input type="password" id="login-password" inputmode="text" placeholder="Enter password" required autocomplete="current-password" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500 transition">
      </div>

      <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold py-3.5 rounded-xl text-sm transition active:scale-95 shadow-lg">
        Sign In 🔐
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errorMsg = document.getElementById('error-msg');

      errorMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = '/';
        } else {
          errorMsg.textContent = data.message || 'Invalid Credentials';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Server Connection Error';
        errorMsg.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
