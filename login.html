<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="/manifest.json">
  <title>Login - Giftoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100vh;
      height: -webkit-fill-available;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      touch-action: none;
      background-color: #0b0f17;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 overflow-hidden fixed inset-0">

  <div class="glass-card p-6 rounded-3xl w-full max-w-sm space-y-5 shadow-2xl">
    <!-- BRANDING LOGO -->
    <div class="flex justify-center">
      <div class="flex items-center bg-slate-900/80 px-4 py-2 rounded-2xl border border-slate-700/60 shadow-inner">
        <svg class="h-8 w-auto" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="20" width="60" height="55" rx="6" fill="#65C9C0"/>
          <rect x="2" y="15" width="66" height="12" rx="3" fill="#65C9C0"/>
          <path d="M25 15C20 5 30 5 35 15Z" fill="#F472B6"/>
          <path d="M45 15C50 5 40 5 35 15Z" fill="#F472B6"/>
          <circle cx="25" cy="40" r="4" fill="#000"/>
          <circle cx="45" cy="40" r="4" fill="#000"/>
          <path d="M30 48Q35 53 40 48Z" fill="#F472B6" stroke="#000" stroke-width="1.5"/>
          <text x="78" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" fill="#42C7BB">giftoo</text>
        </svg>
      </div>
    </div>

    <!-- TITLE -->
    <div class="text-center space-y-1">
      <h1 class="text-xl font-black text-white tracking-tight">Welcome Back</h1>
      <p class="text-xs font-semibold text-slate-400">Sign in with authorized credentials</p>
    </div>

    <!-- ERROR MESSAGE -->
    <div id="error-alert" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold p-3 rounded-xl text-center"></div>

    <!-- FORM -->
    <form onsubmit="handleLogin(event)" class="space-y-3.5">
      <div>
        <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">Username</label>
        <input type="text" id="username" required placeholder="Enter username" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-400">
      </div>

      <div>
        <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">Password</label>
        <input type="password" id="password" required placeholder="Enter password" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-400">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-sky-400 hover:bg-sky-300 text-slate-950 font-black rounded-xl text-xs py-3 mt-2 shadow-lg transition duration-200">
        Sign In 🔑
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('error-alert');
      const submitBtn = document.getElementById('submit-btn');
      
      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          alertBox.innerText = data.message || 'Invalid credentials';
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerText = 'Sign In 🔑';
        }
      } catch (err) {
        alertBox.innerText = 'Network error. Please try again.';
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In 🔑';
      }
    }
  </script>
</body>
</html>
